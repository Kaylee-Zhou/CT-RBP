{% extends "base.html" %}

{% block title %}Explain in detail{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h3 class="mb-0"><i class="bi bi-chat-quote"></i> Sample #{{ row_idx|int + 1 }} Explanation</h3>
    </div>
    <div class="card-body" id="explain-content">
        <!-- The initial display is loading, but the content will be filled in by JS. -->
        <div class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Loading explanation data...</p>
        </div>
    </div>
    <div class="card-footer">
        <a href="/result/{{ session_id }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Return the result list
        </a>
        <a href="/" class="btn btn-outline-primary float-end">
            <i class="bi bi-house"></i> Upload a new file
        </a>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    (async function() {
        const container = document.getElementById('explain-content');
        const sessionId = '{{ session_id }}';
        const rowIdx = {{ row_idx }};

        // Attempt to retrieve from sessionStorage
        let data = null;
        const stored = sessionStorage.getItem('explain_result');
        if (stored) {
            try {
                data = JSON.parse(stored);
                sessionStorage.removeItem('explain_result'); // Clear after use
            } catch (e) {
                console.error('Failed to parse the stored data:', e);
            }
        }

        // If there is no data, it will be re-obtained through the API.
        if (!data || data.status !== 'success') {
            try {
                const response = await fetch(`/api/explain/${sessionId}/${rowIdx}`);
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                data = await response.json();
            } catch (e) {
                container.innerHTML = `<div class="alert alert-danger">Loading failed：${e.message}</div>`;
                return;
            }
        }

        // Render data
        if (data && data.status === 'success') {
            const info = data.parsed_info;
            const infoHtml = `
                <div class="alert alert-info">
                    <p><strong>Sequence Preview:</strong> ${info.sequence_preview}...</p>
                    <p><strong>Model prediction:</strong> ${info.predicted}</p>
                </div>
                <div class="card mb-3">
                    <div class="card-header bg-success text-white">💡 Explanation and Suggestions</div>
                    <div class="card-body">
                        <pre class="mb-0" style="white-space: pre-wrap;">${data.explanation}</pre>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header bg-secondary text-white">📚 The retrieved knowledge base entries</div>
                    <div class="card-body">
                        <ul class="list-group">
                            ${data.retrieved_knowledge.map(doc => `<li class="list-group-item">${doc}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
            container.innerHTML = infoHtml;
        } else {
            container.innerHTML = `<div class="alert alert-danger">Explanation generation failed:${data ? data.error : 'Unknown error'}</div>`;
        }
    })();
</script>
{% endblock %}
